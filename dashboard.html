<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RussFinds | Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e5e5e5; }
    
    /* Login Page */
    .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); }
    .login-box { background: rgba(20, 20, 30, 0.95); backdrop-filter: blur(10px); padding: 2.5rem; border-radius: 32px; width: 380px; text-align: center; border: 1px solid rgba(197, 168, 124, 0.3); }
    .login-box h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .login-box h2 span { color: #c5a87c; }
    .login-box p { color: #888; margin-bottom: 2rem; font-size: 0.85rem; }
    .login-box input { width: 100%; padding: 14px; margin: 10px 0; background: #2a2a35; border: 1px solid #3a3a45; border-radius: 16px; color: white; font-size: 0.9rem; outline: none; }
    .login-box input:focus { border-color: #c5a87c; }
    .login-box button { width: 100%; padding: 14px; background: #c5a87c; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; margin-top: 1rem; color: #0a0a0f; transition: 0.2s; }
    .login-box button:hover { background: #b89a6e; transform: scale(1.02); }
    .error-msg { color: #ff6b6b; font-size: 0.8rem; margin-top: 12px; }
    
    /* Dashboard Main */
    .dashboard { display: none; max-width: 1400px; margin: 0 auto; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
    .header h1 { font-size: 1.8rem; }
    .header h1 span { color: #c5a87c; }
    .back-link { background: #2a2a35; border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; text-decoration: none; font-size: 0.85rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .back-link:hover { background: #c5a87c; color: #0a0a0f; }
    .logout-btn { background: #2a2a35; border: none; padding: 10px 24px; border-radius: 40px; color: white; cursor: pointer; transition: 0.2s; margin-left: 10px; }
    .logout-btn:hover { background: #ff6b6b; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #13131a; border-radius: 24px; padding: 22px; border: 1px solid #25252e; }
    .stat-card i { font-size: 2rem; color: #c5a87c; margin-bottom: 12px; }
    .stat-number { font-size: 2rem; font-weight: 700; margin-top: 8px; }
    .stat-label { color: #888; font-size: 0.85rem; margin-top: 5px; }
    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 20px; flex-wrap: wrap; gap: 15px; }
    .section-title h2 { font-size: 1.4rem; font-weight: 600; }
    .btn-add { background: #c5a87c; border: none; padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; color: #0a0a0f; transition: 0.2s; }
    .btn-add:hover { background: #b89a6e; transform: scale(1.02); }
    .table-container { overflow-x: auto; background: #13131a; border-radius: 24px; border: 1px solid #25252e; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 16px; color: #c5a87c; font-weight: 600; border-bottom: 1px solid #25252e; }
    td { padding: 16px; border-bottom: 1px solid #25252e; vertical-align: middle; }
    .product-img-preview { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; }
    .edit-btn, .delete-btn { background: none; border: none; cursor: pointer; margin-right: 8px; font-size: 1.1rem; }
    .edit-btn { color: #c5a87c; }
    .delete-btn { color: #ff6b6b; }
    .order-btn-small { background: #2e7d32; border: none; border-radius: 20px; padding: 4px 12px; color: white; cursor: pointer; margin-left: 8px; font-size: 0.7rem; }
    
    /* Modal */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 3000; display: none; align-items: center; justify-content: center; }
    .modal-content { background: #1a1a24; max-width: 500px; width: 90%; padding: 28px; border-radius: 32px; border: 1px solid #3a3a44; }
    .modal-content h3 { margin-bottom: 20px; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a32; border: 1px solid #3a3a44; border-radius: 14px; color: white; }
    .modal-content button { background: #c5a87c; border: none; padding: 12px; border-radius: 40px; font-weight: 600; width: 100%; margin-top: 12px; cursor: pointer; color: #0a0a0f; }
    .close-modal { float: right; font-size: 1.5rem; cursor: pointer; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; margin: 10px 0; cursor: pointer; }
  </style>
</head>
<body>

<!-- Login Page -->
<div class="login-container" id="loginContainer">
  <div class="login-box">
    <i class="fas fa-chart-line" style="font-size: 2.5rem; color: #c5a87c; margin-bottom: 15px;"></i>
    <h2>russfinds<span>admin</span></h2>
    <p>Login untuk kelola produk & liat statistik</p>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="off">
    <input type="password" id="loginPass" placeholder="Password">
    <button id="loginBtn">Login ke Dashboard</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- Dashboard Main -->
<div class="dashboard" id="dashboardMain">
  <div class="header">
    <div>
      <h1>russfinds<span>.dashboard</span></h1>
      <p style="font-size: 0.75rem; color: #888; margin-top: 5px;">Kelola produk, atur link, pantau penjualan</p>
    </div>
    <div>
      <a href="index.html" class="back-link"><i class="fas fa-store"></i> Lihat Toko</a>
      <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <!-- Statistik -->
  <div class="stats-grid">
    <div class="stat-card"><i class="fas fa-eye"></i><div class="stat-number" id="totalClicks">0</div><div class="stat-label">Total Klik Produk</div></div>
    <div class="stat-card"><i class="fas fa-shopping-cart"></i><div class="stat-number" id="totalOrders">0</div><div class="stat-label">Total Pesanan</div></div>
    <div class="stat-card"><i class="fas fa-box"></i><div class="stat-number" id="totalProducts">0</div><div class="stat-label">Jumlah Produk</div></div>
    <div class="stat-card"><i class="fas fa-chart-line"></i><div class="stat-number" id="conversionRate">0%</div><div class="stat-label">Konversi (Klik→Order)</div></div>
  </div>

  <!-- Manajemen Produk -->
  <div class="section-title">
    <h2><i class="fas fa-tshirt"></i> Daftar Produk</h2>
    <button class="btn-add" id="openAddBtn"><i class="fas fa-plus"></i> Tambah Produk</button>
  </div>
  <div class="table-container">
    <table>
      <thead>
        <tr><th>Gambar</th><th>Nama Produk</th><th>Harga</th><th>Link Redirect</th><th>Klik</th><th>Order</th><th>Aksi</th>
      </thead>
      <tbody id="productsTableBody"></tbody>
    </table>
  </div>
</div>

<!-- Modal Tambah/Edit Produk -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <span class="close-modal" id="closeModalBtn">&times;</span>
    <h3 id="modalTitle">Tambah Produk Baru</h3>
    <input type="text" id="productName" placeholder="Nama Produk (contoh: Wide Pants Satin)">
    <input type="text" id="productPrice" placeholder="Harga (contoh: Rp 189k)">
    <input type="text" id="productImage" placeholder="URL Gambar (jpg/png)">
    <input type="text" id="productLink" placeholder="Link Redirect (WA / Shopee / Tokopedia)">
    <textarea id="productDesc" rows="2" placeholder="Deskripsi singkat..."></textarea>
    <input type="text" id="productSize" placeholder="Ukuran (S/M/L/XL)">
    <input type="text" id="productColor" placeholder="Warna (Cream, Hitam, Pink)">
    <label class="checkbox-label"><input type="checkbox" id="productBestseller"> <span>⭐ Best Seller</span></label>
    <button id="saveProductBtn">Simpan Produk</button>
    <input type="hidden" id="editProductId">
  </div>
</div>

<script>
  // ========== LOGIN CREDENTIALS (GANTI SESUKA LO) ==========
  const ADMIN_USERNAME = "russfinds";
  const ADMIN_PASSWORD = "russ123";

  let products = [];
  let stats = { totalClicks: 0, totalOrders: 0 };

  function loadData() {
    const stored = localStorage.getItem("russfinds_products");
    products = stored ? JSON.parse(stored) : [];
    const storedStats = localStorage.getItem("russfinds_stats");
    stats = storedStats ? JSON.parse(storedStats) : { totalClicks: 0, totalOrders: 0 };
    renderTable();
    updateStats();
  }

  function saveProducts() {
    localStorage.setItem("russfinds_products", JSON.stringify(products));
    renderTable();
    updateStats();
  }

  function saveStats() {
    localStorage.setItem("russfinds_stats", JSON.stringify(stats));
    updateStats();
  }

  function updateStats() {
    document.getElementById("totalClicks").innerText = stats.totalClicks;
    document.getElementById("totalOrders").innerText = stats.totalOrders;
    document.getElementById("totalProducts").innerText = products.length;
    const conv = stats.totalClicks > 0 ? ((stats.totalOrders / stats.totalClicks) * 100).toFixed(1) : 0;
    document.getElementById("conversionRate").innerText = conv + "%";
  }

  function renderTable() {
    const tbody = document.getElementById("productsTableBody");
    if (!tbody) return;
    tbody.innerHTML = "";
    products.forEach(prod => {
      const row = tbody.insertRow();
      row.innerHTML = `
        <td><img class="product-img-preview" src="${prod.image || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'"></td>
        <td><strong>${prod.name}</strong><br><small style="color:#888">${(prod.desc || '').substring(0, 35)}</small></td>
        <td>${prod.price}</td>
        <td><a href="${prod.link}" target="_blank" style="color:#c5a87c; font-size:0.7rem; word-break:break-all;">${(prod.link || '').substring(0, 35)}</a></td>
        <td>${prod.clicks || 0}</td>
        <td>${prod.orders || 0} <button class="order-btn-small" data-id="${prod.id}">+ Order</button></td>
        <td><button class="edit-btn" data-id="${prod.id}"><i class="fas fa-edit"></i></button> <button class="delete-btn" data-id="${prod.id}"><i class="fas fa-trash"></i></button></td>
      `;
    });

    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => openEditModal(btn.getAttribute('data-id')));
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm("Yakin hapus produk ini?")) {
          products = products.filter(p => p.id !== btn.getAttribute('data-id'));
          saveProducts();
        }
      });
    });
    document.querySelectorAll('.order-btn-small').forEach(btn => {
      btn.addEventListener('click', () => addOrder(btn.getAttribute('data-id')));
    });
  }

  function addOrder(productId) {
    const prod = products.find(p => p.id === productId);
    if (prod) {
      prod.orders = (prod.orders || 0) + 1;
      stats.totalOrders++;
      saveProducts();
      saveStats();
      alert("✅ Pesanan +1 tercatat!");
    }
  }

  function openEditModal(id) {
    const prod = products.find(p => p.id === id);
    if (prod) {
      document.getElementById("modalTitle").innerText = "Edit Produk";
      document.getElementById("productName").value = prod.name;
      document.getElementById("productPrice").value = prod.price;
      document.getElementById("productImage").value = prod.image || "";
      document.getElementById("productLink").value = prod.link;
      document.getElementById("productDesc").value = prod.desc || "";
      document.getElementById("productSize").value = prod.size || "";
      document.getElementById("productColor").value = prod.color || "";
      document.getElementById("productBestseller").checked = prod.bestseller || false;
      document.getElementById("editProductId").value = prod.id;
      document.getElementById("productModal").style.display = "flex";
    }
  }

  function openAddModal() {
    document.getElementById("modalTitle").innerText = "Tambah Produk Baru";
    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productImage").value = "";
    document.getElementById("productLink").value = "";
    document.getElementById("productDesc").value = "";
    document.getElementById("productSize").value = "";
    document.getElementById("productColor").value = "";
    document.getElementById("productBestseller").checked = false;
    document.getElementById("editProductId").value = "";
    document.getElementById("productModal").style.display = "flex";
  }

  function saveProduct() {
    const id = document.getElementById("editProductId").value;
    const name = document.getElementById("productName").value.trim();
    const price = document.getElementById("productPrice").value.trim();
    const image = document.getElementById("productImage").value.trim();
    const link = document.getElementById("productLink").value.trim();
    const desc = document.getElementById("productDesc").value.trim();
    const size = document.getElementById("productSize").value.trim();
    const color = document.getElementById("productColor").value.trim();
    const bestseller = document.getElementById("productBestseller").checked;

    if (!name || !price || !link) {
      alert("⚠️ Nama, Harga, dan Link Redirect wajib diisi!");
      return;
    }

    if (id) {
      const index = products.findIndex(p => p.id === id);
      if (index !== -1) {
        products[index] = { ...products[index], name, price, image, link, desc, size, color, bestseller };
      }
    } else {
      const newId = "prod_" + Date.now();
      products.push({ id: newId, name, price, image, link, desc, size, color, bestseller, clicks: 0, orders: 0 });
    }
    saveProducts();
    document.getElementById("productModal").style.display = "none";
  }

  // ========== LOGIN SYSTEM ==========
  function checkAuth() {
    return localStorage.getItem("russfinds_admin_auth") === "true";
  }

  document.getElementById("loginBtn").onclick = () => {
    const user = document.getElementById("loginUser").value;
    const pass = document.getElementById("loginPass").value;
    if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
      localStorage.setItem("russfinds_admin_auth", "true");
      document.getElementById("loginContainer").style.display = "none";
      document.getElementById("dashboardMain").style.display = "block";
      loadData();
    } else {
      document.getElementById("loginError").innerText = "Username atau password salah!";
    }
  };

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("russfinds_admin_auth");
    document.getElementById("loginContainer").style.display = "flex";
    document.getElementById("dashboardMain").style.display = "none";
    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
  };

  if (checkAuth()) {
    document.getElementById("loginContainer").style.display = "none";
    document.getElementById("dashboardMain").style.display = "block";
    loadData();
  }

  // Modal events
  document.getElementById("openAddBtn").onclick = openAddModal;
  document.getElementById("closeModalBtn").onclick = () => document.getElementById("productModal").style.display = "none";
  document.getElementById("saveProductBtn").onclick = saveProduct;
  window.onclick = (e) => { if (e.target === document.getElementById("productModal")) document.getElementById("productModal").style.display = "none"; };
</script>
</body>
</html>
