<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RussFinds Admin | Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f0f12; color: #ededee; }
    .login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8,8,12,0.96); backdrop-filter: blur(12px);
      z-index: 2000; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #1a1a24; padding: 2.5rem; border-radius: 32px; width: 360px;
      text-align: center; border: 1px solid rgba(255,255,255,0.08);
    }
    .login-card h2 { margin-bottom: 1.5rem; }
    .login-card input {
      width: 100%; padding: 14px; margin: 10px 0; background: #2a2a32;
      border: 1px solid #3a3a44; border-radius: 16px; color: white;
    }
    .login-card button {
      width: 100%; padding: 14px; background: #c5a87c; border: none;
      border-radius: 40px; font-weight: 600; cursor: pointer;
    }
    .dashboard-container { display: none; max-width: 1400px; margin: 0 auto; padding: 20px; }
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo-area h1 { font-size: 1.6rem; }
    .logo-area span { color: #c5a87c; }
    .logout-btn { background: #2a2a32; border: none; padding: 10px 24px; border-radius: 40px; color: white; cursor: pointer; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin: 30px 0;
    }
    .stat-card { background: #15151c; border-radius: 24px; padding: 22px; border: 1px solid #25252e; }
    .stat-card i { font-size: 2rem; color: #c5a87c; }
    .stat-number { font-size: 2rem; font-weight: 700; margin-top: 8px; }
    .section-title {
      font-size: 1.5rem; font-weight: 600; margin: 30px 0 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .btn-add { background: #c5a87c; border: none; padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; }
    .products-table { overflow-x: auto; background: #111116; border-radius: 24px; border: 1px solid #25252e; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #25252e; }
    th { color: #c5a87c; }
    .product-img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 12px; }
    .edit-btn, .delete-btn { background: none; border: none; cursor: pointer; margin-right: 10px; font-size: 1.1rem; }
    .edit-btn { color: #c5a87c; }
    .delete-btn { color: #ff8a7a; }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      z-index: 3000; display: none; align-items: center; justify-content: center;
    }
    .modal-content {
      background: #1a1a24; max-width: 500px; width: 90%; padding: 28px;
      border-radius: 32px; border: 1px solid #3a3a44;
    }
    .modal-content input, .modal-content textarea {
      width: 100%; padding: 12px; margin: 10px 0;
      background: #2a2a32; border: 1px solid #3a3a44; border-radius: 14px; color: white;
    }
    .modal-content button { background: #c5a87c; border: none; padding: 12px; border-radius: 40px; font-weight: 600; width: 100%; margin-top: 12px; cursor: pointer; }
    .close-modal { float: right; font-size: 1.5rem; cursor: pointer; }
    .order-btn-small { background: #2e7d32; border: none; border-radius: 20px; padding: 4px 12px; color: white; cursor: pointer; margin-left: 8px; font-size: 0.7rem; }
  </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <i class="fas fa-lock" style="font-size: 2rem; color: #c5a87c;"></i>
    <h2>Admin RussFinds</h2>
    <input type="text" id="loginUsername" placeholder="Username">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="loginError" style="color:#ff8a7a; margin-top:10px;"></div>
  </div>
</div>

<div class="dashboard-container" id="dashboardMain">
  <div class="dashboard-header">
    <div class="logo-area"><h1>russfinds<span>.admin</span></h1><p style="font-size:0.75rem;">Kelola produk & lihat statistik</p></div>
    <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><i class="fas fa-eye"></i><div class="stat-number" id="totalClicks">0</div><div>Total Klik</div></div>
    <div class="stat-card"><i class="fas fa-shopping-cart"></i><div class="stat-number" id="totalOrders">0</div><div>Total Pesanan</div></div>
    <div class="stat-card"><i class="fas fa-box"></i><div class="stat-number" id="totalProducts">0</div><div>Jumlah Produk</div></div>
    <div class="stat-card"><i class="fas fa-chart-line"></i><div class="stat-number" id="conversionRate">0%</div><div>Konversi</div></div>
  </div>

  <div class="section-title"><span><i class="fas fa-tshirt"></i> Daftar Produk</span><button class="btn-add" id="openAddProductBtn"><i class="fas fa-plus"></i> Tambah Produk</button></div>
  <div class="products-table">
    <table>
      <thead><tr><th>Gambar</th><th>Nama</th><th>Harga</th><th>Link</th><th>Klik</th><th>Order</th><th>Aksi</th></tr></thead>
      <tbody id="productsTableBody"></tbody>
    </table>
  </div>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" id="closeModalBtn">&times;</span>
    <h3 id="modalTitle">Tambah Produk</h3>
    <input type="text" id="productName" placeholder="Nama Produk">
    <input type="text" id="productPrice" placeholder="Harga (Rp 189k)">
    <input type="text" id="productImage" placeholder="URL Gambar">
    <input type="text" id="productLink" placeholder="Link Redirect (WA / Shopee / Tokopedia)">
    <textarea id="productDesc" rows="2" placeholder="Deskripsi"></textarea>
    <input type="text" id="productSize" placeholder="Ukuran (S/M/L/XL)">
    <input type="text" id="productColor" placeholder="Warna">
    <label><input type="checkbox" id="productBestseller"> Best Seller</label>
    <button id="saveProductBtn">Simpan</button>
    <input type="hidden" id="editProductId">
  </div>
</div>

<script>
  // USERNAME & PASSWORD buat login lo doang!
  const ADMIN_USER = "russfinds";
  const ADMIN_PASS = "russ123";

  let products = [];
  let stats = { totalClicks: 0, totalOrders: 0 };

  function loadData() {
    const stored = localStorage.getItem("russfinds_products");
    products = stored ? JSON.parse(stored) : [];
    const storedStats = localStorage.getItem("russfinds_stats");
    stats = storedStats ? JSON.parse(storedStats) : { totalClicks: 0, totalOrders: 0 };
    renderTable();
    updateStats();
  }

  function saveProducts() { localStorage.setItem("russfinds_products", JSON.stringify(products)); renderTable(); updateStats(); }
  function saveStats() { localStorage.setItem("russfinds_stats", JSON.stringify(stats)); updateStats(); }

  function updateStats() {
    document.getElementById("totalClicks").innerText = stats.totalClicks;
    document.getElementById("totalOrders").innerText = stats.totalOrders;
    document.getElementById("totalProducts").innerText = products.length;
    const conv = stats.totalClicks > 0 ? ((stats.totalOrders / stats.totalClicks) * 100).toFixed(1) : 0;
    document.getElementById("conversionRate").innerText = conv + "%";
  }

  function renderTable() {
    const tbody = document.getElementById("productsTableBody");
    tbody.innerHTML = "";
    products.forEach(prod => {
      const row = tbody.insertRow();
      row.innerHTML = `
        <td><img class="product-img-preview" src="${prod.image}" onerror="this.src='https://via.placeholder.com/50'"></td>
        <td><strong>${prod.name}</strong><br><small>${prod.desc?.substring(0,30)}</small></td>
        <td>${prod.price}</td>
        <td><a href="${prod.link}" target="_blank" style="color:#c5a87c; font-size:0.7rem;">${prod.link?.substring(0,35)}</a></td>
        <td>${prod.clicks || 0}</td>
        <td>${prod.orders || 0} <button class="order-btn-small" data-id="${prod.id}">+1 Order</button></td>
        <td><button class="edit-btn" data-id="${prod.id}"><i class="fas fa-edit"></i></button> <button class="delete-btn" data-id="${prod.id}"><i class="fas fa-trash"></i></button></td>
      `;
    });
    document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.getAttribute('data-id'))));
    document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => { if(confirm("Hapus?")) { products = products.filter(p => p.id !== btn.getAttribute('data-id')); saveProducts(); } }));
    document.querySelectorAll('.order-btn-small').forEach(btn => btn.addEventListener('click', () => { addOrder(btn.getAttribute('data-id')); }));
  }

  function addOrder(id) {
    const prod = products.find(p => p.id === id);
    if (prod) { prod.orders = (prod.orders || 0) + 1; stats.totalOrders++; saveProducts(); saveStats(); alert("Order +1!"); }
  }

  function openEditModal(id) {
    const prod = products.find(p => p.id === id);
    if (prod) {
      document.getElementById("modalTitle").innerText = "Edit Produk";
      document.getElementById("productName").value = prod.name;
      document.getElementById("productPrice").value = prod.price;
      document.getElementById("productImage").value = prod.image;
      document.getElementById("productLink").value = prod.link;
      document.getElementById("productDesc").value = prod.desc || "";
      document.getElementById("productSize").value = prod.size || "";
      document.getElementById("productColor").value = prod.color || "";
      document.getElementById("productBestseller").checked = prod.bestseller || false;
      document.getElementById("editProductId").value = prod.id;
      document.getElementById("productModal").style.display = "flex";
    }
  }

  function openAddModal() {
    document.getElementById("modalTitle").innerText = "Tambah Produk Baru";
    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productImage").value = "";
    document.getElementById("productLink").value = "";
    document.getElementById("productDesc").value = "";
    document.getElementById("productSize").value = "";
    document.getElementById("productColor").value = "";
    document.getElementById("productBestseller").checked = false;
    document.getElementById("editProductId").value = "";
    document.getElementById("productModal").style.display = "flex";
  }

  function saveProduct() {
    const id = document.getElementById("editProductId").value;
    const name = document.getElementById("productName").value.trim();
    const price = document.getElementById("productPrice").value.trim();
    const image = document.getElementById("productImage").value.trim();
    const link = document.getElementById("productLink").value.trim();
    const desc = document.getElementById("productDesc").value.trim();
    const size = document.getElementById("productSize").value.trim();
    const color = document.getElementById("productColor").value.trim();
    const bestseller = document.getElementById("productBestseller").checked;
    if (!name || !price || !link) { alert("Nama, Harga, dan Link wajib diisi!"); return; }
    if (id) {
      const index = products.findIndex(p => p.id === id);
      if (index !== -1) products[index] = { ...products[index], name, price, image, link, desc, size, color, bestseller };
    } else {
      products.push({ id: "prod_" + Date.now(), name, price, image, link, desc, size, color, bestseller, clicks: 0, orders: 0 });
    }
    saveProducts();
    document.getElementById("productModal").style.display = "none";
  }

  // LOGIN SYSTEM
  document.getElementById("loginBtn").onclick = () => {
    if (document.getElementById("loginUsername").value === ADMIN_USER && document.getElementById("loginPassword").value === ADMIN_PASS) {
      localStorage.setItem("russfinds_admin_auth", "true");
      document.getElementById("loginOverlay").style.display = "none";
      document.getElementById("dashboardMain").style.display = "block";
      loadData();
    } else { document.getElementById("loginError").innerText = "Username atau password salah!"; }
  };
  document.getElementById("logoutBtn").onclick = () => { localStorage.removeItem("russfinds_admin_auth"); location.reload(); };
  
  if (localStorage.getItem("russfinds_admin_auth") === "true") {
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("dashboardMain").style.display = "block";
    loadData();
  }
  
  document.getElementById("openAddProductBtn").onclick = openAddModal;
  document.getElementById("closeModalBtn").onclick = () => document.getElementById("productModal").style.display = "none";
  document.getElementById("saveProductBtn").onclick = saveProduct;
</script>
</body>
</html>
